<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content in open_folder/ writes its asset URLs relative to the site root
      ("eschbach/logo.jpg"). Routing keeps every URL at `/`, so that already
      holds; this pins it for the one case that does not, a mistyped deep path
      served by the 404.html fallback. Vite substitutes its `base` here.
    -->
    <base href="%BASE_URL%" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website</title>
    <!--
      The build writes the open folder into #root as plain HTML for crawlers
      that run no JavaScript (src/services/prerender.ts). React replaces it on
      mount; until then it is hidden the way screen-reader text is, so it is
      still in the document but never painted.
    -->
    <style>
      .prerender {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
